version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: steam-hub-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=steam_hub_db
    networks:
      - steam-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steam-hub-backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=steam_hub_db
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - steam-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steam-hub-frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
    depends_on:
      - backend
    networks:
      - steam-network

volumes:
  mongodb_data:
    driver: local

networks:
  steam-network:
    driver: bridge
